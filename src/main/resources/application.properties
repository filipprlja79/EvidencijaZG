# tip baze
quarkus.datasource.db-kind=postgresql

# konekcija na bazu
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/Baza1

# login podaci
quarkus.datasource.username=postgres
quarkus.datasource.password=1234

# HTTP port
quarkus.http.port=8081

# CORS za Vite frontend
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,http://127.0.0.1:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.access-control-max-age=24H

# Lokalni demo login za pregled UI/UX-a bez pokrenutog Keycloak-a.
# Za produkciju postaviti DEMO_LOGIN_ENABLED=false.
app.auth.demo-login.enabled=${DEMO_LOGIN_ENABLED:true}
app.auth.demo-password=${DEMO_LOGIN_PASSWORD:Demo12345!}
quarkus.http.auth.basic=true
quarkus.security.users.embedded.enabled=${DEMO_LOGIN_ENABLED:true}
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.admin=${DEMO_LOGIN_PASSWORD:Demo12345!}
quarkus.security.users.embedded.users.starjesina=${DEMO_LOGIN_PASSWORD:Demo12345!}
quarkus.security.users.embedded.users.stanar=${DEMO_LOGIN_PASSWORD:Demo12345!}
quarkus.security.users.embedded.roles.admin=admin
quarkus.security.users.embedded.roles.starjesina=starjesina
quarkus.security.users.embedded.roles.stanar=stanar

# Hibernate ORM - automatski update baze
quarkus.hibernate-orm.database.generation=update

# prikaz SQL upita u konzoli
quarkus.hibernate-orm.log.sql=true

# formatiranje SQL-a (?itljivije)
quarkus.hibernate-orm.log.format-sql=true

# inicijalno u?itavanje (preporuka)
quarkus.hibernate-orm.database.generation.create-schemas=true

# KEYCLOAK
quarkus.oidc.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8180/realms/filipprlja}
quarkus.oidc.client-id=${KEYCLOAK_BACKEND_CLIENT_ID:moja-zgrada-backend}
quarkus.oidc.credentials.secret=${KEYCLOAK_BACKEND_CLIENT_SECRET:change-me}
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.token.principal-claim=sub

app.keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:8180}
app.keycloak.realm=${KEYCLOAK_REALM:filipprlja}
app.keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8180/realms/filipprlja}
app.keycloak.frontend-client-id=${KEYCLOAK_FRONTEND_CLIENT_ID:moja-zgrada-frontend}
app.keycloak.frontend-client-secret=${KEYCLOAK_FRONTEND_CLIENT_SECRET:}
app.keycloak.backend-client-id=${KEYCLOAK_BACKEND_CLIENT_ID:moja-zgrada-backend}
app.keycloak.backend-client-secret=${KEYCLOAK_BACKEND_CLIENT_SECRET:}

# EMAIL. Ne upisivati stvarne lozinke u repo; postaviti preko env varijabli.
app.mail.enabled=${APP_MAIL_ENABLED:false}
quarkus.mailer.from=${SMTP_FROM:filipprlja79@gmail.com}
quarkus.mailer.host=${SMTP_HOST:smtp.gmail.com}
quarkus.mailer.port=${SMTP_PORT:587}
quarkus.mailer.username=${SMTP_USER:disabled}
quarkus.mailer.password=${SMTP_PASS:disabled}
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.mock=${MAIL_MOCK:true}

# SWAGGER
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# REST CLIENTI
quarkus.rest-client.ipify-api.url=https://api.ipify.org
quarkus.rest-client.time-api.url=https://timeapi.io
quarkus.rest-client.currency-api.url=https://api.euroratesapi.dev
